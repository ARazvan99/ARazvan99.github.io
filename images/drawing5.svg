<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Placeholder drawing — Bridge project, concrete bridge">
  <defs>
    <pattern id="grid-minor" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#cbd5e1" stroke-width="0.4"/>
    </pattern>
    <pattern id="grid-major" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#grid-minor)"/>
      <path d="M100 0H0V100" fill="none" stroke="#94a3b8" stroke-width="0.7"/>
    </pattern>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg5)"/>
  <rect width="800" height="600" fill="url(#grid-major)"/>

  <rect x="20" y="20" width="760" height="510" fill="none" stroke="#1e3a5f" stroke-width="2"/>

  <!-- title block -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1e3a5f">
    <rect x="500" y="30" width="270" height="34" fill="#1e3a5f"/>
    <text x="635" y="52" font-size="13" fill="#fff" text-anchor="middle" letter-spacing="2">BRIDGE PROJECT</text>
    <text x="500" y="86" font-size="10" fill="#475569">CONCRETE BRIDGE · ELEVATION  ·  SCALE 1:100  ·  REV. 00</text>
  </g>

  <!-- ground / water -->
  <g>
    <line x1="60" y1="380" x2="740" y2="380" stroke="#1e3a5f" stroke-width="1.5"/>
    <!-- river hatching -->
    <g stroke="#94a3b8" stroke-width="0.7">
      <line x1="80" y1="395" x2="100" y2="415"/>
      <line x1="110" y1="395" x2="130" y2="415"/>
      <line x1="140" y1="395" x2="160" y2="415"/>
      <line x1="170" y1="395" x2="190" y2="415"/>
      <line x1="200" y1="395" x2="220" y2="415"/>
      <line x1="230" y1="395" x2="250" y2="415"/>
      <line x1="260" y1="395" x2="280" y2="415"/>
      <line x1="290" y1="395" x2="310" y2="415"/>
      <line x1="320" y1="395" x2="340" y2="415"/>
      <line x1="350" y1="395" x2="370" y2="415"/>
      <line x1="380" y1="395" x2="400" y2="415"/>
      <line x1="410" y1="395" x2="430" y2="415"/>
      <line x1="440" y1="395" x2="460" y2="415"/>
      <line x1="470" y1="395" x2="490" y2="415"/>
      <line x1="500" y1="395" x2="520" y2="415"/>
      <line x1="530" y1="395" x2="550" y2="415"/>
      <line x1="560" y1="395" x2="580" y2="415"/>
      <line x1="590" y1="395" x2="610" y2="415"/>
      <line x1="620" y1="395" x2="640" y2="415"/>
      <line x1="650" y1="395" x2="670" y2="415"/>
      <line x1="680" y1="395" x2="700" y2="415"/>
    </g>
    <text x="120" y="430" font-family="ui-monospace, monospace" font-size="12" fill="#475569" font-style="italic">RIVER BED</text>
  </g>

  <!-- bridge deck -->
  <rect x="120" y="280" width="560" height="36" fill="#cbd5e1" stroke="#1e3a5f" stroke-width="2"/>

  <!-- piers -->
  <g fill="#e2e8f0" stroke="#1e3a5f" stroke-width="1.6">
    <rect x="260" y="316" width="40" height="64"/>
    <rect x="500" y="316" width="40" height="64"/>
  </g>
  <!-- pier caps -->
  <g fill="#1e3a5f">
    <rect x="252" y="312" width="56" height="8"/>
    <rect x="492" y="312" width="56" height="8"/>
  </g>

  <!-- abutments -->
  <g fill="#cbd5e1" stroke="#1e3a5f" stroke-width="1.8">
    <polygon points="120,316 90,380 120,380"/>
    <polygon points="680,316 710,380 680,380"/>
  </g>

  <!-- railings -->
  <g stroke="#1e3a5f" stroke-width="1.4" fill="none">
    <line x1="120" y1="276" x2="680" y2="276"/>
    <line x1="120" y1="280" x2="680" y2="280"/>
    <line x1="140" y1="280" x2="140" y2="316"/>
    <line x1="200" y1="280" x2="200" y2="316"/>
    <line x1="300" y1="280" x2="300" y2="316"/>
    <line x1="400" y1="280" x2="400" y2="316"/>
    <line x1="500" y1="280" x2="500" y2="316"/>
    <line x1="600" y1="280" x2="600" y2="316"/>
    <line x1="660" y1="280" x2="660" y2="316"/>
  </g>

  <!-- dimension / span labels -->
  <g font-family="ui-monospace, monospace" font-size="11" fill="#1e3a5f" text-anchor="middle">
    <text x="160" y="265">SPAN 1</text>
    <text x="380" y="265">SPAN 2</text>
    <text x="600" y="265">SPAN 3</text>
    <text x="160" y="298">20.00 m</text>
    <text x="380" y="298">24.00 m</text>
    <text x="600" y="298">20.00 m</text>
  </g>

  <!-- pier labels -->
  <g font-family="ui-monospace, monospace" font-size="10" fill="#475569" text-anchor="middle">
    <text x="280" y="395">PIER P1</text>
    <text x="520" y="395">PIER P2</text>
  </g>

  <!-- north arrow -->
  <g transform="translate(70,80)">
    <circle r="22" fill="#fff" stroke="#1e3a5f" stroke-width="1.4"/>
    <polygon points="0,-18 6,4 0,-2 -6,4" fill="#1e3a5f"/>
    <polygon points="0,18 6,-4 0,2 -6,-4" fill="#fff" stroke="#1e3a5f" stroke-width="1"/>
    <text y="-26" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle" fill="#1e3a5f" font-weight="700">N</text>
  </g>

  <!-- placeholder stamp -->
  <g transform="translate(540,200) rotate(-12)" opacity="0.35">
    <rect x="-110" y="-22" width="220" height="44" fill="none" stroke="#d97706" stroke-width="2"/>
    <text x="0" y="6" font-family="ui-monospace, monospace" font-size="22" font-weight="700" fill="#d97706" text-anchor="middle" letter-spacing="3">PLACEHOLDER</text>
  </g>

  <rect x="20" y="530" width="760" height="50" fill="#1e3a5f"/>
  <text x="40" y="562" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#fff" letter-spacing="2">DRAWING 05 — BRIDGE PROJECT · CONCRETE BRIDGE</text>
  <text x="760" y="562" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#d97706" text-anchor="end">AFLOAREI R.-B.</text>
</svg>