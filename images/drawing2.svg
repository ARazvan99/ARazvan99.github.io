<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Placeholder drawing — Cadastral plan, lot subdivision">
  <defs>
    <pattern id="grid-minor" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#cbd5e1" stroke-width="0.4"/>
    </pattern>
    <pattern id="grid-major" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#grid-minor)"/>
      <path d="M100 0H0V100" fill="none" stroke="#94a3b8" stroke-width="0.7"/>
    </pattern>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg2)"/>
  <rect width="800" height="600" fill="url(#grid-major)"/>

  <rect x="20" y="20" width="760" height="510" fill="none" stroke="#1e3a5f" stroke-width="2"/>

  <!-- title block top-right -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1e3a5f">
    <rect x="500" y="30" width="270" height="34" fill="#1e3a5f"/>
    <text x="635" y="52" font-size="13" fill="#fff" text-anchor="middle" letter-spacing="2">CADASTRAL PLAN</text>
    <text x="500" y="86" font-size="10" fill="#475569">LOT SUBDIVISION  ·  SCALE 1:1000  ·  REV. 00</text>
  </g>

  <!-- parent lot outline -->
  <rect x="120" y="160" width="560" height="320" fill="none" stroke="#1e3a5f" stroke-width="2.2"/>

  <!-- subdivided lots -->
  <g stroke="#1e3a5f" stroke-width="1.6" fill="#ffffff">
    <rect x="120" y="160" width="180" height="160"/>
    <rect x="300" y="160" width="180" height="160"/>
    <rect x="480" y="160" width="200" height="160"/>
    <rect x="120" y="320" width="280" height="160"/>
    <rect x="400" y="320" width="280" height="160"/>
  </g>

  <!-- lot labels -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#1e3a5f" font-weight="700">
    <text x="210" y="245" text-anchor="middle">LOT 1</text>
    <text x="390" y="245" text-anchor="middle">LOT 2</text>
    <text x="580" y="245" text-anchor="middle">LOT 3</text>
    <text x="260" y="405" text-anchor="middle">LOT 4</text>
    <text x="540" y="405" text-anchor="middle">LOT 5</text>
  </g>
  <!-- lot areas -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#475569">
    <text x="210" y="262" text-anchor="middle">850 mp</text>
    <text x="390" y="262" text-anchor="middle">920 mp</text>
    <text x="580" y="262" text-anchor="middle">1 050 mp</text>
    <text x="260" y="422" text-anchor="middle">1 410 mp</text>
    <text x="540" y="422" text-anchor="middle">1 480 mp</text>
  </g>

  <!-- dimension marks (top) -->
  <g stroke="#d97706" stroke-width="0.8" fill="none">
    <path d="M120 140 L300 140"/><path d="M120 136 L120 144"/><path d="M300 136 L300 144"/>
    <path d="M300 140 L480 140"/><path d="M480 136 L480 144"/>
    <path d="M480 140 L680 140"/><path d="M680 136 L680 144"/>
  </g>
  <g font-family="ui-monospace, monospace" font-size="10" fill="#d97706" text-anchor="middle">
    <text x="210" y="134">18.00</text><text x="390" y="134">18.00</text><text x="580" y="134">20.00</text>
  </g>

  <!-- north arrow -->
  <g transform="translate(70,80)">
    <circle r="22" fill="#fff" stroke="#1e3a5f" stroke-width="1.4"/>
    <polygon points="0,-18 6,4 0,-2 -6,4" fill="#1e3a5f"/>
    <polygon points="0,18 6,-4 0,2 -6,-4" fill="#fff" stroke="#1e3a5f" stroke-width="1"/>
    <text y="-26" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle" fill="#1e3a5f" font-weight="700">N</text>
  </g>

  <!-- placeholder stamp -->
  <g transform="translate(200,420) rotate(-12)" opacity="0.35">
    <rect x="-110" y="-22" width="220" height="44" fill="none" stroke="#d97706" stroke-width="2"/>
    <text x="0" y="6" font-family="ui-monospace, monospace" font-size="22" font-weight="700" fill="#d97706" text-anchor="middle" letter-spacing="3">PLACEHOLDER</text>
  </g>

  <rect x="20" y="530" width="760" height="50" fill="#1e3a5f"/>
  <text x="40" y="562" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#fff" letter-spacing="2">DRAWING 02 — CADASTRAL PLAN · LOT SUBDIVISION</text>
  <text x="760" y="562" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#d97706" text-anchor="end">AFLOAREI R.-B.</text>
</svg>