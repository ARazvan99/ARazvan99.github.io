<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Professional photo placeholder — replace with real photo">
  <defs>
    <linearGradient id="bg-photo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#11243d"/>
    </linearGradient>
    <pattern id="grid-photo" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg-photo)"/>
  <rect width="800" height="600" fill="url(#grid-photo)"/>
  <g transform="translate(400,300)">
    <circle r="160" fill="rgba(255,255,255,.06)" stroke="rgba(217,119,6,.4)" stroke-width="2"/>
    <circle r="120" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.15)" stroke-width="1"/>
    <text x="0" y="20" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto" font-size="180" font-weight="700" fill="#d97706" text-anchor="middle" letter-spacing="-6">AB</text>
    <text x="0" y="260" font-family="ui-monospace, monospace" font-size="16" fill="rgba(255,255,255,.5)" text-anchor="middle" letter-spacing="6">AFLOAREI RAZVAN-BOGDAN</text>
    <text x="0" y="285" font-family="ui-monospace, monospace" font-size="11" fill="rgba(255,255,255,.35)" text-anchor="middle" letter-spacing="3">REPLACE WITH PHOTO</text>
  </g>
</svg>