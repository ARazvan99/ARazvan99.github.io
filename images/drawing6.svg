<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Placeholder drawing — PNRR-funded civic project">
  <defs>
    <pattern id="grid-minor" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#cbd5e1" stroke-width="0.4"/>
    </pattern>
    <pattern id="grid-major" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#grid-minor)"/>
      <path d="M100 0H0V100" fill="none" stroke="#94a3b8" stroke-width="0.7"/>
    </pattern>
    <linearGradient id="bg6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg6)"/>
  <rect width="800" height="600" fill="url(#grid-major)"/>

  <rect x="20" y="20" width="760" height="510" fill="none" stroke="#1e3a5f" stroke-width="2"/>

  <!-- title block -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1e3a5f">
    <rect x="500" y="30" width="270" height="34" fill="#1e3a5f"/>
    <text x="635" y="52" font-size="13" fill="#fff" text-anchor="middle" letter-spacing="2">PNRR CIVIC PROJECT</text>
    <text x="500" y="86" font-size="10" fill="#475569">SITE PLAN  ·  SCALE 1:500  ·  REV. 00</text>
  </g>

  <!-- funding badge -->
  <g transform="translate(60,40)">
    <rect width="170" height="32" fill="#d97706" rx="4"/>
    <text x="85" y="21" font-family="ui-monospace, monospace" font-size="12" fill="#fff" text-anchor="middle" font-weight="700" letter-spacing="2">EU · PNRR FUNDED</text>
  </g>

  <!-- main building -->
  <g>
    <rect x="120" y="200" width="240" height="200" fill="#ffffff" stroke="#1e3a5f" stroke-width="2"/>
    <line x1="120" y1="240" x2="360" y2="240" stroke="#1e3a5f" stroke-width="1.2"/>
    <line x1="120" y1="320" x2="360" y2="320" stroke="#1e3a5f" stroke-width="1.2"/>
    <line x1="200" y1="200" x2="200" y2="400" stroke="#1e3a5f" stroke-width="1.2"/>
    <line x1="280" y1="200" x2="280" y2="400" stroke="#1e3a5f" stroke-width="1.2"/>
    <text x="240" y="310" font-family="ui-monospace, monospace" font-size="12" fill="#1e3a5f" font-weight="700" text-anchor="middle">CIVIC CENTRE</text>
  </g>

  <!-- annex building -->
  <g>
    <rect x="420" y="220" width="160" height="120" fill="#ffffff" stroke="#1e3a5f" stroke-width="2"/>
    <line x1="420" y1="260" x2="580" y2="260" stroke="#1e3a5f" stroke-width="1.2"/>
    <line x1="500" y1="220" x2="500" y2="340" stroke="#1e3a5f" stroke-width="1.2"/>
    <text x="500" y="285" font-family="ui-monospace, monospace" font-size="11" fill="#1e3a5f" font-weight="700" text-anchor="middle">ANNEX</text>
  </g>

  <!-- parking -->
  <g>
    <rect x="620" y="200" width="130" height="160" fill="#f1f5f9" stroke="#1e3a5f" stroke-width="1.4" stroke-dasharray="4 4"/>
    <text x="685" y="285" font-family="ui-monospace, monospace" font-size="11" fill="#475569" text-anchor="middle">PARKING</text>
  </g>

  <!-- access road -->
  <path d="M40 460 L760 460" stroke="#1e3a5f" stroke-width="14"/>
  <path d="M40 460 L760 460" stroke="#e2e8f0" stroke-width="10"/>
  <path d="M40 460 L760 460" stroke="#d97706" stroke-width="1" stroke-dasharray="10 8"/>

  <!-- landscaping (trees) -->
  <g fill="#1e3a5f">
    <circle cx="110" cy="170" r="8" opacity="0.6"/>
    <circle cx="160" cy="150" r="6" opacity="0.6"/>
    <circle cx="380" cy="180" r="7" opacity="0.6"/>
    <circle cx="400" cy="160" r="6" opacity="0.6"/>
    <circle cx="600" cy="180" r="7" opacity="0.6"/>
    <circle cx="610" cy="155" r="6" opacity="0.6"/>
    <circle cx="170" cy="430" r="7" opacity="0.6"/>
    <circle cx="380" cy="430" r="8" opacity="0.6"/>
    <circle cx="560" cy="430" r="7" opacity="0.6"/>
  </g>

  <!-- legend -->
  <g transform="translate(420,400)">
    <rect width="330" height="100" fill="#ffffff" stroke="#1e3a5f" stroke-width="1.2"/>
    <text x="10" y="20" font-family="ui-monospace, monospace" font-size="11" fill="#1e3a5f" font-weight="700">LEGEND</text>
    <g font-family="ui-monospace, monospace" font-size="10" fill="#1e3a5f">
      <rect x="10" y="32" width="14" height="10" fill="#ffffff" stroke="#1e3a5f"/>
      <text x="30" y="41">Building footprint</text>
      <rect x="10" y="50" width="14" height="10" fill="#f1f5f9" stroke="#1e3a5f" stroke-dasharray="2 2"/>
      <text x="30" y="59">Parking area</text>
      <line x1="10" y1="72" x2="24" y2="72" stroke="#1e3a5f" stroke-width="3"/>
      <text x="30" y="76">Access road</text>
      <circle cx="17" cy="88" r="4" fill="#1e3a5f" opacity="0.6"/>
      <text x="30" y="92">Existing vegetation</text>
    </g>
  </g>

  <!-- north arrow -->
  <g transform="translate(70,110)">
    <circle r="22" fill="#fff" stroke="#1e3a5f" stroke-width="1.4"/>
    <polygon points="0,-18 6,4 0,-2 -6,4" fill="#1e3a5f"/>
    <polygon points="0,18 6,-4 0,2 -6,-4" fill="#fff" stroke="#1e3a5f" stroke-width="1"/>
    <text y="-26" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle" fill="#1e3a5f" font-weight="700">N</text>
  </g>

  <!-- placeholder stamp -->
  <g transform="translate(200,120) rotate(-12)" opacity="0.30">
    <rect x="-110" y="-22" width="220" height="44" fill="none" stroke="#d97706" stroke-width="2"/>
    <text x="0" y="6" font-family="ui-monospace, monospace" font-size="22" font-weight="700" fill="#d97706" text-anchor="middle" letter-spacing="3">PLACEHOLDER</text>
  </g>

  <rect x="20" y="530" width="760" height="50" fill="#1e3a5f"/>
  <text x="40" y="562" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#fff" letter-spacing="2">DRAWING 06 — PNRR-FUNDED CIVIC PROJECT</text>
  <text x="760" y="562" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#d97706" text-anchor="end">AFLOAREI R.-B.</text>
</svg>