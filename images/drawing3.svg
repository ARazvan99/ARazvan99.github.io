<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Placeholder drawing — Institutional building, school design">
  <defs>
    <pattern id="grid-minor" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#cbd5e1" stroke-width="0.4"/>
    </pattern>
    <pattern id="grid-major" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#grid-minor)"/>
      <path d="M100 0H0V100" fill="none" stroke="#94a3b8" stroke-width="0.7"/>
    </pattern>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg3)"/>
  <rect width="800" height="600" fill="url(#grid-major)"/>

  <rect x="20" y="20" width="760" height="510" fill="none" stroke="#1e3a5f" stroke-width="2"/>

  <!-- title block top-right -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1e3a5f">
    <rect x="500" y="30" width="270" height="34" fill="#1e3a5f"/>
    <text x="635" y="52" font-size="13" fill="#fff" text-anchor="middle" letter-spacing="2">INSTITUTIONAL BUILDING</text>
    <text x="500" y="86" font-size="10" fill="#475569">SCHOOL · GROUND FLOOR  ·  SCALE 1:100  ·  REV. 00</text>
  </g>

  <!-- building outline -->
  <g stroke="#1e3a5f" stroke-width="2.2" fill="#ffffff">
    <rect x="120" y="160" width="560" height="280"/>
  </g>

  <!-- interior partitions -->
  <g stroke="#1e3a5f" stroke-width="1.4" fill="none">
    <!-- corridor -->
    <rect x="120" y="280" width="560" height="50"/>
    <!-- classrooms row (top) -->
    <line x1="260" y1="160" x2="260" y2="280"/>
    <line x1="400" y1="160" x2="400" y2="280"/>
    <line x1="540" y1="160" x2="540" y2="280"/>
    <!-- classrooms row (bottom) -->
    <line x1="240" y1="330" x2="240" y2="440"/>
    <line x1="380" y1="330" x2="380" y2="440"/>
    <line x1="520" y1="330" x2="520" y2="440"/>
    <!-- entry / lobby left -->
    <line x1="180" y1="160" x2="180" y2="280"/>
  </g>

  <!-- doors (arcs) -->
  <g stroke="#d97706" stroke-width="1" fill="none">
    <path d="M180 220 A 30 30 0 0 1 210 250"/>
    <path d="M260 220 A 30 30 0 0 1 290 250"/>
    <path d="M400 220 A 30 30 0 0 1 430 250"/>
    <path d="M540 220 A 30 30 0 0 1 570 250"/>
    <path d="M240 370 A 30 30 0 0 1 270 400"/>
    <path d="M380 370 A 30 30 0 0 1 410 400"/>
    <path d="M520 370 A 30 30 0 0 1 550 400"/>
  </g>

  <!-- room labels -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#1e3a5f" text-anchor="middle">
    <text x="150" y="225" font-size="10">ENTRY</text>
    <text x="190" y="225">HALL</text>
    <text x="330" y="225">CLASS 1</text>
    <text x="470" y="225">CLASS 2</text>
    <text x="610" y="225">CLASS 3</text>
    <text x="400" y="310">CORRIDOR</text>
    <text x="180" y="395">ADMIN</text>
    <text x="310" y="395">CLASS 4</text>
    <text x="450" y="395">CLASS 5</text>
    <text x="600" y="395">GYM</text>
  </g>

  <!-- north arrow -->
  <g transform="translate(70,80)">
    <circle r="22" fill="#fff" stroke="#1e3a5f" stroke-width="1.4"/>
    <polygon points="0,-18 6,4 0,-2 -6,4" fill="#1e3a5f"/>
    <polygon points="0,18 6,-4 0,2 -6,-4" fill="#fff" stroke="#1e3a5f" stroke-width="1"/>
    <text y="-26" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle" fill="#1e3a5f" font-weight="700">N</text>
  </g>

  <!-- placeholder stamp -->
  <g transform="translate(560,470) rotate(-12)" opacity="0.35">
    <rect x="-110" y="-22" width="220" height="44" fill="none" stroke="#d97706" stroke-width="2"/>
    <text x="0" y="6" font-family="ui-monospace, monospace" font-size="22" font-weight="700" fill="#d97706" text-anchor="middle" letter-spacing="3">PLACEHOLDER</text>
  </g>

  <rect x="20" y="530" width="760" height="50" fill="#1e3a5f"/>
  <text x="40" y="562" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#fff" letter-spacing="2">DRAWING 03 — INSTITUTIONAL BUILDING · SCHOOL</text>
  <text x="760" y="562" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#d97706" text-anchor="end">AFLOAREI R.-B.</text>
</svg>