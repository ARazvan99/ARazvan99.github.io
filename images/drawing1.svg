<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Placeholder drawing — Topographical survey, urban area">
  <defs>
    <pattern id="grid-minor" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#cbd5e1" stroke-width="0.4"/>
    </pattern>
    <pattern id="grid-major" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#grid-minor)"/>
      <path d="M100 0H0V100" fill="none" stroke="#94a3b8" stroke-width="0.7"/>
    </pattern>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg1)"/>
  <rect width="800" height="600" fill="url(#grid-major)"/>

  <!-- frame -->
  <rect x="20" y="20" width="760" height="510" fill="none" stroke="#1e3a5f" stroke-width="2"/>

  <!-- title block top-right -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1e3a5f">
    <rect x="500" y="30" width="270" height="34" fill="#1e3a5f"/>
    <text x="635" y="52" font-size="13" fill="#fff" text-anchor="middle" letter-spacing="2">TOPOGRAPHICAL SURVEY</text>
    <text x="500" y="86" font-size="10" fill="#475569">SCALE 1:500  ·  URBAN AREA  ·  REV. 00</text>
  </g>

  <!-- contour lines (hint of topo) -->
  <g fill="none" stroke="#1e3a5f" stroke-width="1.1" opacity="0.55">
    <path d="M40 380 C 140 360 220 340 320 360 S 500 400 620 370 S 740 350 780 360"/>
    <path d="M40 410 C 140 392 220 376 320 392 S 500 432 620 402 S 740 384 780 392"/>
    <path d="M40 440 C 140 426 220 412 320 426 S 500 462 620 436 S 740 420 780 426"/>
    <path d="M40 470 C 140 458 220 446 320 458 S 500 492 620 466 S 740 452 780 458"/>
    <path d="M40 500 C 140 490 220 480 320 490 S 500 522 620 498 S 740 486 780 490"/>
  </g>
  <!-- spot heights -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#1e3a5f" opacity="0.7">
    <circle cx="170" cy="380" r="2.2" fill="#d97706" stroke="#1e3a5f" stroke-width="0.8"/>
    <text x="178" y="376">125.40</text>
    <circle cx="380" cy="360" r="2.2" fill="#d97706" stroke="#1e3a5f" stroke-width="0.8"/>
    <text x="388" y="356">127.10</text>
    <circle cx="580" cy="400" r="2.2" fill="#d97706" stroke="#1e3a5f" stroke-width="0.8"/>
    <text x="588" y="396">124.85</text>
  </g>

  <!-- north arrow -->
  <g transform="translate(70,80)">
    <circle r="22" fill="#fff" stroke="#1e3a5f" stroke-width="1.4"/>
    <polygon points="0,-18 6,4 0,-2 -6,4" fill="#1e3a5f"/>
    <polygon points="0,18 6,-4 0,2 -6,-4" fill="#fff" stroke="#1e3a5f" stroke-width="1"/>
    <text y="-26" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle" fill="#1e3a5f" font-weight="700">N</text>
  </g>

  <!-- placeholder stamp -->
  <g transform="translate(560,200) rotate(-12)" opacity="0.35">
    <rect x="-110" y="-22" width="220" height="44" fill="none" stroke="#d97706" stroke-width="2"/>
    <text x="0" y="6" font-family="ui-monospace, monospace" font-size="22" font-weight="700" fill="#d97706" text-anchor="middle" letter-spacing="3">PLACEHOLDER</text>
  </g>

  <!-- title strip bottom -->
  <rect x="20" y="530" width="760" height="50" fill="#1e3a5f"/>
  <text x="40" y="562" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#fff" letter-spacing="2">DRAWING 01 — TOPOGRAPHICAL SURVEY · URBAN AREA</text>
  <text x="760" y="562" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#d97706" text-anchor="end">AFLOAREI R.-B.</text>
</svg>