<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Placeholder drawing — Road design, county road">
  <defs>
    <pattern id="grid-minor" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#cbd5e1" stroke-width="0.4"/>
    </pattern>
    <pattern id="grid-major" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#grid-minor)"/>
      <path d="M100 0H0V100" fill="none" stroke="#94a3b8" stroke-width="0.7"/>
    </pattern>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg4)"/>
  <rect width="800" height="600" fill="url(#grid-major)"/>

  <rect x="20" y="20" width="760" height="510" fill="none" stroke="#1e3a5f" stroke-width="2"/>

  <!-- title block -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1e3a5f">
    <rect x="500" y="30" width="270" height="34" fill="#1e3a5f"/>
    <text x="635" y="52" font-size="13" fill="#fff" text-anchor="middle" letter-spacing="2">ROAD DESIGN</text>
    <text x="500" y="86" font-size="10" fill="#475569">COUNTY ROAD · PLAN VIEW  ·  SCALE 1:2000  ·  REV. 00</text>
  </g>

  <!-- road surface -->
  <g>
    <!-- outer edges -->
    <path d="M40 240 C 200 220 360 290 500 270 S 740 240 780 250"
          fill="none" stroke="#1e3a5f" stroke-width="22" stroke-linecap="round"/>
    <!-- inner edge -->
    <path d="M40 240 C 200 220 360 290 500 270 S 740 240 780 250"
          fill="none" stroke="#e2e8f0" stroke-width="16" stroke-linecap="round"/>
    <!-- centerline (dashed) -->
    <path d="M40 240 C 200 220 360 290 500 270 S 740 240 780 250"
          fill="none" stroke="#d97706" stroke-width="1.4" stroke-dasharray="14 10"/>
  </g>

  <!-- station markers -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#1e3a5f">
    <g>
      <circle cx="40" cy="240" r="5" fill="#fff" stroke="#1e3a5f" stroke-width="1.5"/>
      <text x="50" y="222">KM 0+000</text>
    </g>
    <g>
      <circle cx="280" cy="262" r="5" fill="#fff" stroke="#1e3a5f" stroke-width="1.5"/>
      <text x="290" y="282">KM 0+500</text>
    </g>
    <g>
      <circle cx="520" cy="270" r="5" fill="#fff" stroke="#1e3a5f" stroke-width="1.5"/>
      <text x="530" y="290">KM 1+000</text>
    </g>
    <g>
      <circle cx="780" cy="250" r="5" fill="#fff" stroke="#1e3a5f" stroke-width="1.5"/>
      <text x="730" y="232">KM 1+520</text>
    </g>
  </g>

  <!-- cross-section reference -->
  <g transform="translate(180,420)">
    <rect x="0" y="0" width="440" height="90" fill="#ffffff" stroke="#1e3a5f" stroke-width="1.2"/>
    <text x="10" y="20" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#1e3a5f" font-weight="700">TYPICAL CROSS-SECTION 1:50</text>
    <!-- road cross-section -->
    <rect x="100" y="40" width="240" height="22" fill="#cbd5e1" stroke="#1e3a5f" stroke-width="1"/>
    <line x1="220" y1="40" x2="220" y2="62" stroke="#d97706" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="160" y="56" font-family="ui-monospace, monospace" font-size="10" fill="#1e3a5f">7.00 m</text>
    <text x="260" y="56" font-family="ui-monospace, monospace" font-size="10" fill="#1e3a5f">2.00 m</text>
    <text x="380" y="56" font-family="ui-monospace, monospace" font-size="10" fill="#1e3a5f">2.00 m</text>
    <text x="90" y="80" font-family="ui-monospace, monospace" font-size="9" fill="#475569">shoulder</text>
    <text x="180" y="80" font-family="ui-monospace, monospace" font-size="9" fill="#475569">carriageway</text>
    <text x="320" y="80" font-family="ui-monospace, monospace" font-size="9" fill="#475569">shoulder</text>
  </g>

  <!-- north arrow -->
  <g transform="translate(70,80)">
    <circle r="22" fill="#fff" stroke="#1e3a5f" stroke-width="1.4"/>
    <polygon points="0,-18 6,4 0,-2 -6,4" fill="#1e3a5f"/>
    <polygon points="0,18 6,-4 0,2 -6,-4" fill="#fff" stroke="#1e3a5f" stroke-width="1"/>
    <text y="-26" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle" fill="#1e3a5f" font-weight="700">N</text>
  </g>

  <!-- placeholder stamp -->
  <g transform="translate(580,180) rotate(-12)" opacity="0.35">
    <rect x="-110" y="-22" width="220" height="44" fill="none" stroke="#d97706" stroke-width="2"/>
    <text x="0" y="6" font-family="ui-monospace, monospace" font-size="22" font-weight="700" fill="#d97706" text-anchor="middle" letter-spacing="3">PLACEHOLDER</text>
  </g>

  <rect x="20" y="530" width="760" height="50" fill="#1e3a5f"/>
  <text x="40" y="562" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#fff" letter-spacing="2">DRAWING 04 — ROAD DESIGN · COUNTY ROAD</text>
  <text x="760" y="562" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#d97706" text-anchor="end">AFLOAREI R.-B.</text>
</svg>